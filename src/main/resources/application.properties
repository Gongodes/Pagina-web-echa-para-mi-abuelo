spring.application.name=email-formalizer-jar

# Email Configuration
# IMPORTANT: Replace placeholders with your actual Gmail credentials.
# For security, consider using an App Password if you have 2FA enabled on your Gmail account.
# In a production environment, avoid hardcoding credentials. Use environment variables or a secrets manager.

# Sender configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gonzamanuagu@gmail.com # Sender's email address
spring.mail.password=YOUR_GMAIL_APP_PASSWORD_HERE # Placeholder for sender's password or App Password

# SMTP properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true # Use STARTTLS
# spring.mail.properties.mail.smtp.ssl.enable=true # Alternative: SSL on port 465, if starttls is false
spring.mail.properties.mail.smtp.starttls.required=true # Recommended for security with STARTTLS

# Optional: For debugging SMTP communication (very verbose)
# spring.mail.properties.mail.debug=true

# Default Recipient Email (can be overridden or supplemented in controller logic if needed)
email.default.recipient=gonzalo.godoy.esp@gmail.com
